# Display name for registries that read the OpenAI skill presentation file.
# ClawHub needs it (nvm-monorepo#2853): it discards a publisher --name equal to
# the titleized slug and falls back to frontmatter `name:` (the kebab slug), but
# this file outranks frontmatter. The path and the `interface:` map are what its
# parser reads. No `short_description`, so the summary stays the frontmatter one.
interface:
  display_name: Nevermined Router
