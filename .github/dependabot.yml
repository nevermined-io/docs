version: 2
updates:
  # viem in the catalog-onboarding payer, which signs payments with a raw private
  # key (nevermined-io/docs#629). package.json pins it exactly, so each update is
  # a PR that bumps the pin and regenerates package-lock.json, and
  # .github/workflows/c402pay-selfcheck.yml installs and self-checks it on that PR.
  # That proves the lock installs and loads; it does not exercise viem's signing.
  # The cooldown matches the folder's policy of pinning only a release at least
  # 14 days old. It does not delay security updates.
  # Merging such a PR changes the skill, so the ClawHub publish runs on main.
  - package-ecosystem: npm
    directory: /skills/nevermined-catalog-onboarding/references/c402pay
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
  # The ClawHub CLI that publish-skill-clawhub.yml runs next to CLAWHUB_TOKEN
  # (nevermined-io/docs#647). package.json pins it exactly, so each update is a
  # PR that bumps the pin and regenerates package-lock.json, and
  # .github/workflows/clawhub-cli-check.yml installs it on that PR and checks
  # that it starts, is the pinned version, and still lists every command and
  # option the publish uses. That check never logs in, so it does not prove the
  # publish still works: the publish step parses the CLI's JSON `status`, which
  # later CLIs report differently. Read the bump's changelog. Merging the PR
  # runs the ClawHub publish on main, a no-op for every unchanged skill.
  - package-ecosystem: npm
    directory: /.github/clawhub-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
