version: 2
updates:
  # viem in the catalog-onboarding payer, which signs payments with a raw private
  # key (nevermined-io/docs#629). package.json pins it exactly, so each update is
  # a PR that bumps the pin and regenerates package-lock.json, and
  # .github/workflows/c402pay-selfcheck.yml installs and self-checks it on that PR.
  # That proves the lock installs and loads; it does not exercise viem's signing.
  # The cooldown matches the folder's policy of pinning only a release at least
  # 14 days old. It does not delay security updates.
  # Merging such a PR changes the skill, so the ClawHub publish runs on main.
  - package-ecosystem: npm
    directory: /skills/nevermined-catalog-onboarding/references/c402pay
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
  # The ClawHub CLI that publish-skill-clawhub.yml runs next to CLAWHUB_TOKEN
  # (nevermined-io/docs#647). package.json pins it exactly, so each update is a
  # PR that bumps the pin and regenerates package-lock.json, and
  # .github/workflows/clawhub-cli-check.yml checks it on that PR: the lock
  # installs, the CLI is the pinned version, it still lists every command and
  # option the publish uses and reports no publish status the publish does not
  # handle, and every locked package is at least 14 days old. Version updates
  # pass the cooldown to npm as `--min-release-age`; security updates skip it,
  # and the age check reports the young packages they lock. The check never
  # logs in, so read the bump's changelog for server-side changes. Merging the
  # PR runs the ClawHub publish on main.
  # The folder is NOT under .github/: Dependabot's npm updater cannot open a PR
  # that changes a file there. Every job for /.github/clawhub-cli resolved its
  # bump, then failed creating the PR with HTTP 400 "The request contains
  # invalid or unauthorized changes" (dependency_file_not_supported, docs#647).
  - package-ecosystem: npm
    directory: /tools/clawhub-cli
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
