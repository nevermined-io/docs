name: Publish skill to ClawHub

# Publishes this repo's skills to ClawHub under the `nevermined-io` publisher —
# the same org used for the OpenClaw plugin. Runs on demand and whenever a skill
# changes on `main`.
#
#   skills/nevermined-payments            → https://clawhub.ai/skills/nevermined
#   skills/nevermined-router              → https://clawhub.ai/skills/nevermined-router
#   skills/nevermined-catalog-onboarding  → https://clawhub.ai/skills/nevermined-catalog-onboarding
#
# Required repository secret:
#   CLAWHUB_TOKEN — a ClawHub API token belonging to a user who owns the
#   `nevermined-io` publisher (create at https://clawhub.ai, `clawhub token`).
#
# Versioning (decided on docs#624, 2026-11-11): ClawHub version numbers belong
# to ClawHub and are deliberately decoupled from the `version:` in a skill's
# SKILL.md frontmatter, which the CLI never reads. They already differ for every
# skill (payments: 1.0.x on ClawHub, 0.5.x in its frontmatter). The CLI publishes
# 1.0.0 for a new slug and the latest public version + 1 after that (`--help`:
# "defaults to 1.0.0 or next patch"), and this workflow skips any number a held
# version has taken (below). The optional per-skill matrix `version` pins one
# publish to an exact number. It is not used for routine publishing: remove it
# once that version is public, or the next run fails because the number is taken.
#
# Held versions: ClawHub accepts an upload as a HELD version and makes it public
# only after its security scans pass. A held version is invisible
# to the lookup the CLI derives "latest" from (/api/v1/resolve), yet its number
# is taken. So when a version is held for good (a scan that blocked it, failed
# or expired), the CLI keeps choosing that same number and the server keeps
# answering "Version X already exists". Both nevermined-router (0.1.38) and
# nevermined-catalog-onboarding (1.0.0) were stuck that way from Oct 2026
# (docs#624). The publish step therefore (1) skips past a taken number, printing
# the held version's scan stage, and (2) waits until the new version is PUBLIC,
# failing the run if ClawHub blocks it, fails it or never releases it. A green
# run means the version is live. Before this, the run that created 0.1.38 went
# green although 0.1.38 was never released.
#
# The push trigger is path-filtered on `skills/**`, so a change to ONE skill
# still runs the matrix legs for the others. Those legs are no-ops: when the
# folder's content fingerprint matches a public version, the CLI reports
# `"status": "unchanged"`, exits 0 and uploads nothing.
#
# Adding a skill: add one entry to the matrix. Nothing else needs to change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/publish-skill-clawhub.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.slug }} to ClawHub
    runs-on: ubuntu-latest
    # The publish step waits up to 30 minutes for ClawHub to release the version.
    timeout-minutes: 45
    # Per-skill so the legs never queue behind each other, and a rerun of one
    # skill can't cancel an in-flight publish of another. It also holds the next
    # run of a skill back until this one's version is public, so that run can
    # recognise unchanged content instead of uploading it again.
    concurrency:
      group: clawhub-publish-${{ matrix.slug }}
      cancel-in-progress: false
    strategy:
      # One skill failing to publish must not stop the other from publishing.
      fail-fast: false
      matrix:
        include:
          - path: skills/nevermined-payments
            slug: nevermined
            name: Nevermined Payments
          - path: skills/nevermined-router
            slug: nevermined-router
            name: Nevermined Router
          - path: skills/nevermined-catalog-onboarding
            slug: nevermined-catalog-onboarding
            name: Nevermined Catalog Onboarding
    env:
      SKILL_PATH: ${{ matrix.path }}
      OWNER: nevermined-io
      SLUG: ${{ matrix.slug }}
      SKILL_NAME: ${{ matrix.name }}
      SKILL_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install ClawHub CLI
        run: npm install -g clawhub@^0.22

      # A skill folder is also a Claude Code plugin (`.claude-plugin/` holds its
      # plugin.json and directory icon), and `clawhub skill publish` refuses any
      # folder with a plugin manifest ("This looks like a plugin"). Publish a copy
      # without it; --source-path still names the real folder in this repo.
      - name: Stage the skill without its plugin manifest
        run: |
          STAGED="$RUNNER_TEMP/$(basename "$SKILL_PATH")"
          rsync -a --exclude '.claude-plugin/' "$SKILL_PATH/" "$STAGED/"
          echo "PUBLISH_PATH=$STAGED" >> "$GITHUB_ENV"

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is not configured. Add a token of a '${OWNER}' publisher owner in repo or org settings."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Dry-run publish
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          # The version reported here can be one a held version has taken; the
          # publish step then skips to the next free number.
          #
          # `if`, not `[ -n … ] && …`. Both behave identically *here*: the default
          # shell is `bash -e`, and errexit ignores a failing non-final element of
          # an && list. But that list's own status is 1 when SKILL_VERSION is
          # unset, so the && form fails the step the moment anyone moves it to the
          # last line. `if` has no such edge — verified both ways.
          VERSION_ARG=()
          if [ -n "${SKILL_VERSION:-}" ]; then VERSION_ARG=(--version "$SKILL_VERSION"); fi
          clawhub --no-input skill publish "$PUBLISH_PATH" \
            --owner "$OWNER" --slug "$SLUG" --name "$SKILL_NAME" \
            "${VERSION_ARG[@]}" \
            --source-repo "$SOURCE_REPO" --source-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" --source-path "$SKILL_PATH" \
            --dry-run --json

      # See "Held versions" at the top of this file.
      - name: Publish to ClawHub
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_API: https://clawhub.ai/api/v1
          MAX_TAKEN: 5          # taken version numbers to skip before giving up
          TIMEOUT_MINUTES: 30   # the default of ClawHub's own reusable publish workflow
          POLL_SECONDS: 20
        run: |
          # Reads one exact version's publication state from the owner-only
          # endpoint (GET /skills/{slug}/versions/{version}/publication) and
          # prints it. Sets HTTP, STAGE and RETRYING; STAGE is empty when the
          # state could not be read. Never fails the step.
          read_publication() {
            local resp body
            resp=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer $CLAWHUB_TOKEN" \
              "$CLAWHUB_API/skills/$SLUG/versions/$1/publication?ownerHandle=$OWNER" 2>&1) || true
            HTTP=${resp##*$'\n'}
            body=${resp%$'\n'*}
            STAGE=''
            RETRYING=''
            if [ "$HTTP" = 200 ]; then
              STAGE=$(jq -r '.publication.stage // empty' <<<"$body" 2>/dev/null) || STAGE=''
              RETRYING=$(jq -r '.publication.retrying // false' <<<"$body" 2>/dev/null) || RETRYING=''
            fi
            if [ -n "$STAGE" ]; then
              echo "$SLUG@$1: stage=$STAGE retrying=$RETRYING checks=$(jq -c '.publication.checks // {}' <<<"$body")"
            else
              echo "$SLUG@$1: publication state unavailable (HTTP $HTTP): $body"
            fi
          }

          # 1. Upload. With no pinned version the CLI picks the latest PUBLIC
          #    version + 1, and that number may belong to a held version: skip
          #    past it, at most MAX_TAKEN times.
          ERR="$RUNNER_TEMP/clawhub-publish.err"
          VERSION="${SKILL_VERSION:-}"
          TAKEN_COUNT=0
          while :; do
            VERSION_ARG=()
            if [ -n "$VERSION" ]; then VERSION_ARG=(--version "$VERSION"); fi
            STATUS=0
            OUT=$(clawhub --no-input skill publish "$PUBLISH_PATH" \
              --owner "$OWNER" --slug "$SLUG" --name "$SKILL_NAME" \
              "${VERSION_ARG[@]}" \
              --source-repo "$SOURCE_REPO" --source-commit "$SOURCE_COMMIT" \
              --source-ref "$SOURCE_REF" --source-path "$SKILL_PATH" \
              --json 2>"$ERR") || STATUS=$?
            if [ -n "$OUT" ]; then echo "$OUT"; fi
            cat "$ERR"
            if [ "$STATUS" -eq 0 ]; then break; fi

            TAKEN=$(grep -oE 'Version [0-9]+\.[0-9]+\.[0-9]+ already exists' "$ERR" | head -n 1 | cut -d' ' -f2) || TAKEN=''
            if [ -z "$TAKEN" ]; then
              echo "::error::ClawHub skill publish failed (see output above)."
              exit "$STATUS"
            fi
            read_publication "$TAKEN"
            if [ -n "${SKILL_VERSION:-}" ]; then
              echo "::error::The matrix pins $SLUG to $SKILL_VERSION, which ClawHub already has (state above). Remove the pin, or pin an unused version."
              exit 1
            fi
            TAKEN_COUNT=$((TAKEN_COUNT + 1))
            if [ "$TAKEN_COUNT" -ge "$MAX_TAKEN" ]; then
              echo "::error::$MAX_TAKEN version numbers in a row are taken by versions ClawHub has not released (states above). Find out why before publishing more."
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<<"$TAKEN"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            echo "$SLUG@$TAKEN is taken by a version ClawHub has not released; trying $VERSION."
          done

          RESULT=$(jq -r '.status' <<<"$OUT")
          PUBLISHED=$(jq -r '.version' <<<"$OUT")
          case "$RESULT" in
            unchanged)
              echo "$SLUG@$PUBLISHED is public with this exact content. Nothing to publish."
              exit 0 ;;
            published) ;;
            *)
              echo "::error::Unexpected publish result '$RESULT' (see output above)."
              exit 1 ;;
          esac

          # 2. The upload is a held version until its scans pass. Wait for it
          #    to go public: a green run must mean the version is live. Live is
          #    what an installer sees: the public, unauthenticated version read.
          echo "Uploaded $SLUG@$PUBLISHED. Waiting up to $TIMEOUT_MINUTES minutes for ClawHub to release it."
          DEADLINE=$((SECONDS + TIMEOUT_MINUTES * 60))
          while :; do
            read_publication "$PUBLISHED"
            case "$STAGE" in
              published)
                PUBLIC=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
                  "$CLAWHUB_API/skills/$SLUG/versions/$PUBLISHED" 2>/dev/null) || true
                if [ "$PUBLIC" = 200 ]; then
                  echo "Published $OWNER/$SLUG@$PUBLISHED: https://clawhub.ai/skills/$SLUG"
                  exit 0
                fi
                echo "$SLUG@$PUBLISHED is released but not publicly readable yet (HTTP $PUBLIC)." ;;
              blocked | failed | expired)
                echo "::error::ClawHub did not release $SLUG@$PUBLISHED (stage: $STAGE). Scan report: clawhub scan download @$OWNER/$SLUG --version $PUBLISHED"
                exit 1 ;;
              checks_failed | checks_incomplete)
                if [ "$RETRYING" != true ]; then
                  echo "::error::ClawHub's checks on $SLUG@$PUBLISHED did not complete and will not be retried (stage: $STAGE)."
                  exit 1
                fi ;;
            esac
            if [ "$HTTP" = 401 ] || [ "$HTTP" = 403 ]; then
              echo "::error::CLAWHUB_TOKEN cannot read $SLUG's publication state (HTTP $HTTP)."
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::$SLUG@$PUBLISHED is still not public after $TIMEOUT_MINUTES minutes (last stage: ${STAGE:-unknown})."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
