name: Publish skill to ClawHub

# Publishes this repo's skills to ClawHub under the `nevermined-io` publisher —
# the same org used for the OpenClaw plugin. Runs on demand and whenever a skill
# changes on `main`.
#
#   skills/nevermined-payments → https://clawhub.ai/skills/nevermined
#   skills/nevermined-router   → https://clawhub.ai/skills/nevermined-router
#
# Required repository secret:
#   CLAWHUB_TOKEN — a ClawHub API token belonging to a user who owns the
#   `nevermined-io` publisher (create at https://clawhub.ai, `clawhub token`).
#
# Versioning: on REPUBLISH the CLI auto-increments from the latest published
# version. On a brand-new slug there is nothing to increment from, and the CLI
# does NOT read the version out of SKILL.md frontmatter — `clawhub skill publish
# --help` documents `--version` as "defaults to 1.0.0 or next patch". So a first
# publish would land as 1.0.0 and permanently contradict the `version:` in the
# skill's own frontmatter (which the rendered skill header shows to users).
# Hence the optional per-skill `version` in the matrix below: set it for the
# FIRST publish of a new slug, then delete it and let auto-increment take over.
#
# The push trigger is path-filtered on `skills/**`, so a change to ONE skill
# still runs the matrix leg for the other — that leg is a no-op, because
# republishing an unchanged version is handled as "already published" below.
#
# Adding a skill: add one entry to the matrix. Nothing else needs to change.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/workflows/publish-skill-clawhub.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.slug }} to ClawHub
    runs-on: ubuntu-latest
    # Per-skill so the two legs never queue behind each other, and a rerun of one
    # skill can't cancel an in-flight publish of the other.
    concurrency:
      group: clawhub-publish-${{ matrix.slug }}
      cancel-in-progress: false
    strategy:
      # One skill failing to publish must not stop the other from publishing.
      fail-fast: false
      matrix:
        include:
          - path: skills/nevermined-payments
            slug: nevermined
            name: Nevermined Payments
          - path: skills/nevermined-router
            slug: nevermined-router
            name: Nevermined Router
            # First publish of a new slug only — pins it to the frontmatter
            # version instead of the CLI's 1.0.0 default. Delete this line once
            # it has published once; auto-increment takes over from there.
            version: "0.1.0"
    env:
      SKILL_PATH: ${{ matrix.path }}
      OWNER: nevermined-io
      SLUG: ${{ matrix.slug }}
      SKILL_NAME: ${{ matrix.name }}
      SKILL_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install ClawHub CLI
        run: npm install -g clawhub@^0.22

      - name: Authenticate with ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::CLAWHUB_TOKEN secret is not configured. Add a token of a '${OWNER}' publisher owner in repo or org settings."
            exit 1
          fi
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub whoami

      - name: Dry-run publish
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          # `if`, not `[ -n … ] && …`. Both behave identically *here*: the default
          # shell is `bash -e`, and errexit ignores a failing non-final element of
          # an && list. But that list's own status is 1 when SKILL_VERSION is
          # unset, so the && form fails the step the moment anyone moves it to the
          # last line. `if` has no such edge — verified both ways.
          VERSION_ARG=()
          if [ -n "${SKILL_VERSION:-}" ]; then VERSION_ARG=(--version "$SKILL_VERSION"); fi
          clawhub --no-input skill publish "$SKILL_PATH" \
            --owner "$OWNER" --slug "$SLUG" --name "$SKILL_NAME" \
            "${VERSION_ARG[@]}" \
            --source-repo "$SOURCE_REPO" --source-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" --source-path "$SKILL_PATH" \
            --dry-run --json

      - name: Publish to ClawHub
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          VERSION_ARG=()
          if [ -n "${SKILL_VERSION:-}" ]; then VERSION_ARG=(--version "$SKILL_VERSION"); fi
          set +e
          OUT=$(clawhub --no-input skill publish "$SKILL_PATH" \
            --owner "$OWNER" --slug "$SLUG" --name "$SKILL_NAME" \
            "${VERSION_ARG[@]}" \
            --source-repo "$SOURCE_REPO" --source-commit "$SOURCE_COMMIT" \
            --source-ref "$SOURCE_REF" --source-path "$SKILL_PATH" \
            --json 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"
          if [ $STATUS -ne 0 ]; then
            # Idempotent: an unchanged version is a no-op, not a failure.
            if echo "$OUT" | grep -qi "already published"; then
              echo "Version already published — nothing to do."
              exit 0
            fi
            echo "::error::ClawHub skill publish failed (see output above)."
            exit $STATUS
          fi
          echo "Published $OWNER/$SLUG to ClawHub: https://clawhub.ai/skills/$SLUG"
